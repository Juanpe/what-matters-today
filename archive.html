<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archivo — What Matters Today</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AI Digest">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <meta name="theme-color" content="#111110">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --text: #151515;
      --muted: #6f6f6b;
      --line: #e4e4e0;
      --hover: #f3f3f0;
    }
    [data-theme="dark"] {
      --bg: #111110;
      --surface: #1a1a18;
      --text: #f4f4f0;
      --muted: #a5a59f;
      --line: #30302d;
      --hover: #252522;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", "Inter", sans-serif;
      transition: background .2s ease, color .2s ease;
    }
    a { color: inherit; }
    button { font: inherit; }

    .page {
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px 36px 80px;
    }

    /* Header */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .14em;
    }
    .logo::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 4px rgba(16,185,129,.12);
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .lang-toggle {
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .04em;
      cursor: pointer;
      transition: transform .15s ease, background .2s ease;
    }
    .lang-toggle:hover { transform: scale(1.04); background: var(--hover); }
    .theme-toggle {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
      display: grid;
      place-items: center;
      transition: transform .15s ease, background .2s ease;
    }
    .theme-toggle:hover { transform: scale(1.04); }

    /* Hero */
    .hero { margin: 56px 0 40px; }
    .eyebrow {
      color: var(--muted);
      font-size: 13px;
      font-weight: 850;
      letter-spacing: .16em;
    }
    h1 {
      margin: 14px 0 8px;
      font-size: clamp(52px, 8vw, 88px);
      line-height: .96;
      letter-spacing: -.05em;
      font-weight: 850;
    }
    .hero-subtitle {
      margin: 20px 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      text-decoration: underline;
      text-decoration-style: dotted;
      text-decoration-color: var(--line);
      text-underline-offset: 5px;
    }
    .back-link:hover {
      color: var(--text);
      text-decoration-color: var(--muted);
    }

    /* Archive list */
    .archive-count { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .latest-edition {
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
      padding: 28px 32px; border: 1px solid var(--line); border-radius: 20px;
      background: var(--hover); text-decoration: none;
    }
    .latest-label { display: block; color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .latest-date { display: block; margin: 10px 0 16px; font-size: clamp(22px, 4vw, 32px); font-weight: 750; letter-spacing: -.04em; }
    .latest-action { font-size: 14px; font-weight: 650; }
    .latest-arrow { display: grid; place-items: center; flex-shrink: 0; width: 48px; height: 48px; border-radius: 50%; background: var(--text); color: var(--bg); font-size: 22px; }
    .archive-month { margin-top: 36px; }
    .month-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .month-heading h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.03em; }
    .month-heading h2::first-letter { text-transform: uppercase; }
    .month-heading span { color: var(--muted); font-size: 12px; }
    .month-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 16px 0 0; padding: 0; list-style: none; }
    .archive-item { display: flex; align-items: center; gap: 16px; height: 100%; min-height: 100px; padding: 20px; border: 1px solid var(--line); border-radius: 14px; text-decoration: none; transition: background .15s ease, border-color .15s ease; }
    .archive-item:hover, .latest-edition:hover { background: var(--surface); border-color: var(--muted); }
    .archive-day { font-size: 36px; line-height: 1; font-weight: 750; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
    .archive-weekday { display: block; font-size: 14px; text-transform: capitalize; }
    .archive-date { display: block; color: var(--muted); font-size: 12px; margin-top: 5px; }
    .archive-arrow { margin-left: auto; color: var(--muted); }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--text); outline-offset: 5px; }
    .empty-state {
      color: var(--muted);
      padding: 30px 0;
    }

    @media (max-width: 700px) {
      .page { padding: 20px 20px 60px; }
      .logo { font-size: 11px; letter-spacing: .06em; }
      .topbar-actions { gap: 6px; }
      .hero { margin-top: 40px; }
      .month-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .archive-item { padding: 16px; gap: 12px; }
      .latest-edition { padding: 24px; gap: 16px; }
    }
    @media (max-width: 420px) {
      .month-grid { grid-template-columns: 1fr; gap: 8px; }
      .archive-item { min-height: 80px; }
      .latest-arrow { width: 40px; height: 40px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; } }
    .site-footer {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .site-footer .footer-name {
      font-weight: 800;
      color: var(--text);
    }
    .site-footer-icons {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .footer-icon-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      color: var(--muted);
      transition: transform .15s ease, background .2s ease, color .15s ease, border-color .2s ease;
    }
    .footer-icon-link svg { width: 14px; height: 14px; }
    .footer-icon-link:hover {
      transform: scale(1.08);
      background: var(--hover);
      color: var(--text);
      border-color: var(--muted);
    }
  </style>
  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "58ccca5df20d4a4baf95cd6954a621cb"}'></script>
  <!-- End Cloudflare Web Analytics -->
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="logo">WHAT MATTERS TODAY</div>
      <div class="topbar-actions">
        <button class="lang-toggle" id="lang-toggle" type="button" aria-label="Switch language" onclick="toggleLang()">ES</button>
        <button class="theme-toggle" type="button" aria-label="Cambiar tema" onclick="toggleTheme()">◐</button>
      </div>
    </header>

    <section class="hero">
      <div class="eyebrow" id="hero-eyebrow">HISTORIAL</div>
      <h1 id="hero-title">Archivo</h1>
      <p class="hero-subtitle" id="hero-subtitle">Todas las ediciones anteriores del digest.</p>
      <a class="back-link" id="back-link" href="index.html">← Volver a hoy</a>
    </section>

    <div class="archive-list" id="archive-list" aria-live="polite" aria-busy="true"></div>

    <footer class="site-footer">
      <span class="footer-sentence"><span id="footer-madewith">Hecho con ❤️ por</span> <span class="footer-name">Juanpe Catalán</span></span>
      <span class="site-footer-icons">
        <a class="footer-icon-link" href="https://juanpecatalan.com" target="_blank" rel="noopener" aria-label="Web">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3 12h18"></path>
            <path d="M12 3c2.5 2.6 4 6 4 9s-1.5 6.4-4 9c-2.5-2.6-4-6-4-9s1.5-6.4 4-9z"></path>
          </svg>
        </a>
        <a class="footer-icon-link" href="https://www.linkedin.com/in/juan-pedro-catalan-8a58a825" target="_blank" rel="noopener" aria-label="LinkedIn">
          <svg viewBox="0 0 448 512" fill="currentColor">
            <path d="M100.28 448H7.4V149.5h92.88zm-46.44-339.5c-29.71 0-53.79-24.08-53.79-53.79S24.14 1 53.85 1s53.79 24.08 53.79 53.79-24.08 53.71-53.8 53.71zM447.9 448h-92.68V302.4c0-34.7-.7-79.3-48.29-79.3-48.29 0-55.7 37.7-55.7 76.7V448h-92.78V149.5h89.08v40.8h1.3c12.4-23.5 42.7-48.3 87.9-48.3 94 0 111.28 61.9 111.28 142.3V448z"></path>
          </svg>
        </a>
        <a class="footer-icon-link" href="https://x.com/JuanpeCatalan" target="_blank" rel="noopener" aria-label="X">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
          </svg>
        </a>
      </span>
    </footer>
  </main>

  <script>
    /* Theme */
    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("digest-theme", theme);
    }
    function toggleTheme() {
      const current = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
      setTheme(current === "dark" ? "light" : "dark");
    }
    const savedTheme = localStorage.getItem("digest-theme");
    if (savedTheme) setTheme(savedTheme);
    else if (window.matchMedia?.("(prefers-color-scheme: dark)").matches) setTheme("dark");

    /* i18n */
    const UI = {
      es: {
        locale: "es-ES",
        eyebrow: "HISTORIAL",
        title: "Archivo",
        subtitle: "Todas las ediciones anteriores del digest.",
        backLink: "← Volver a hoy",
        empty: "Todavía no hay ediciones en el archivo.",
        today: "Hoy",
        madeWith: "Hecho con ❤️ por",
        langToggleLabel: "Switch to English",
        latest: "Última edición",
        openEdition: "Leer edición",
        editions: "ediciones",
        edition: "edición",
        themeAria: "Cambiar tema",
        loading: "Cargando ediciones…",
        loadError: "No se pudo cargar el archivo. Recarga la página para volver a intentarlo.",
      },
      en: {
        locale: "en-US",
        eyebrow: "ARCHIVE",
        title: "Archive",
        subtitle: "All previous editions of the digest.",
        backLink: "← Back to today",
        empty: "No editions in the archive yet.",
        today: "Today",
        madeWith: "Made with ❤️ by",
        langToggleLabel: "Cambiar a español",
        latest: "Latest edition",
        openEdition: "Read edition",
        editions: "editions",
        edition: "edition",
        themeAria: "Toggle theme",
        loading: "Loading editions…",
        loadError: "Could not load the archive. Reload the page to try again.",
      },
    };

    function detectLang() {
      const urlLang = new URLSearchParams(location.search).get("lang");
      if (urlLang === "es" || urlLang === "en") return urlLang;
      const saved = localStorage.getItem("digest-lang");
      if (saved === "es" || saved === "en") return saved;
      return (navigator.language || "").toLowerCase().startsWith("en") ? "en" : "es";
    }

    let currentLang = detectLang();
    let CACHED_DATES = null;
    let archiveLoadFailed = false;

    function t(key) {
      return UI[currentLang][key] ?? UI.es[key] ?? "";
    }

    function updateStaticText() {
      document.documentElement.lang = currentLang;
      document.title = `${t("title")} — What Matters Today`;
      document.querySelector(".theme-toggle").setAttribute("aria-label", t("themeAria"));
      document.getElementById("hero-eyebrow").textContent = t("eyebrow");
      document.getElementById("hero-title").textContent = t("title");
      document.getElementById("hero-subtitle").textContent = t("subtitle");
      document.getElementById("back-link").textContent = t("backLink");
      const langBtn = document.getElementById("lang-toggle");
      langBtn.textContent = currentLang === "es" ? "EN" : "ES";
      langBtn.setAttribute("aria-label", t("langToggleLabel"));
      const footerMadeWith = document.getElementById("footer-madewith");
      if (footerMadeWith) footerMadeWith.textContent = t("madeWith");
      const backLink = document.getElementById("back-link");
      if (backLink) backLink.href = `index.html?lang=${encodeURIComponent(currentLang)}`;
      if (CACHED_DATES === null) document.getElementById("archive-list").textContent = t("loading");
    }

    function setLang(lang) {
      currentLang = lang === "en" ? "en" : "es";
      localStorage.setItem("digest-lang", currentLang);
      const url = new URL(location.href);
      url.searchParams.set("lang", currentLang);
      history.replaceState(null, "", url);
      updateStaticText();
      if (CACHED_DATES) renderArchiveList(CACHED_DATES);
    }

    function toggleLang() {
      setLang(currentLang === "es" ? "en" : "es");
    }

    /* Helpers */
    function escapeHTML(value) {
      const div = document.createElement("div");
      div.textContent = value ?? "";
      return div.innerHTML;
    }
    function unwrapDates(raw) {
  if (Array.isArray(raw)) {
    if (
      raw.length &&
      raw[0] &&
      Array.isArray(raw[0].dates)
    ) {
      return raw[0].dates;
    }

    return raw;
  }

  if (raw && Array.isArray(raw.dates)) {
    return raw.dates;
  }

  return [];
}
    function formatLabel(dateStr) {
      const d = new Date(dateStr + "T00:00:00");
      return d.toLocaleDateString(UI[currentLang].locale, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    }

    async function loadArchiveIndex() {
      try {
        const res = await fetch("data/archive-index.json?_=" + Date.now());
        if (!res.ok) throw new Error("No archive index");
        const dates = unwrapDates(await res.json());
        return [...new Set(dates.filter(date => typeof date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(date) && !Number.isNaN(Date.parse(date))))].sort().reverse();
      } catch (e) {
        console.warn("Archive index fallback:", e);
        archiveLoadFailed = true;
        return [];
      }
    }

    function renderArchiveList(dates) {
      const list = document.getElementById("archive-list");
      list.setAttribute("aria-busy", "false");

      if (!dates.length) {
        list.innerHTML = `<p class="empty-state">${escapeHTML(t(archiveLoadFailed ? "loadError" : "empty"))}</p>`;
        return;
      }

      const editionUrl = date => `index.html?date=${encodeURIComponent(date)}&lang=${currentLang}`;
      const countLabel = count => `${count} ${t(count === 1 ? "edition" : "editions")}`;
      const months = new Map();
      dates.slice(1).forEach(date => {
        const month = date.slice(0, 7);
        if (!months.has(month)) months.set(month, []);
        months.get(month).push(date);
      });
      list.innerHTML = `
        <p class="archive-count">${countLabel(dates.length)}</p>
        <a class="latest-edition" href="${editionUrl(dates[0])}">
          <span><span class="latest-label">${t("latest")}</span>
            <time class="latest-date" datetime="${dates[0]}">${escapeHTML(formatLabel(dates[0]))}</time>
            <span class="latest-action">${t("openEdition")}</span></span>
          <span class="latest-arrow" aria-hidden="true">↗</span>
        </a>
        ${[...months].map(([month, entries]) => `
          <section class="archive-month" aria-labelledby="month-${month}">
            <div class="month-heading"><h2 id="month-${month}">${escapeHTML(new Date(month + "-01T00:00:00").toLocaleDateString(UI[currentLang].locale, { month: "long", year: "numeric" }))}</h2><span>${countLabel(entries.length)}</span></div>
            <ul class="month-grid">${entries.map(date => `
              <li><a class="archive-item" href="${editionUrl(date)}">
                <span class="archive-day" aria-hidden="true">${date.slice(8)}</span>
                <time datetime="${date}"><span class="archive-weekday">${escapeHTML(new Date(date + "T00:00:00").toLocaleDateString(UI[currentLang].locale, { weekday: "long" }))}</span>
                  <span class="archive-date">${escapeHTML(new Date(date + "T00:00:00").toLocaleDateString(UI[currentLang].locale, { day: "numeric", month: "short", year: "numeric" }))}</span></time>
                <span class="archive-arrow" aria-hidden="true">↗</span>
              </a></li>`).join("")}</ul>
          </section>`).join("")}`;
    }

    async function init() {
      const urlLang = new URLSearchParams(location.search).get("lang");
      if (urlLang === "es" || urlLang === "en") {
        currentLang = urlLang;
        localStorage.setItem("digest-lang", currentLang);
      }
      updateStaticText();
      const dates = await loadArchiveIndex();
      CACHED_DATES = dates;
      renderArchiveList(dates);
    }

    init();
  </script>
</body>
</html>

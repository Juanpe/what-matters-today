<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>AI Daily Digest</title>

<style>
:root {
  --bg: #f5f5f2;
  --surface: #ffffff;
  --surface-2: #eeeeeb;
  --text: #171717;
  --muted: #777;
  --muted-2: #555;
  --border: #dfdfda;
  --accent: #171717;
  --shadow: 0 1px 2px rgba(0,0,0,.03);
}
html[data-theme="dark"] {
  --bg: #11110f;
  --surface: #1b1b19;
  --surface-2: #292926;
  --text: #f1f1ed;
  --muted: #9a9a94;
  --muted-2: #c2c2bb;
  --border: #343431;
  --accent: #f1f1ed;
  --shadow: 0 1px 2px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
a { color: inherit; }
.container { width: min(980px, calc(100% - 32px)); margin: auto; padding: 38px 0 72px; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 20px; margin-bottom: 54px;
}
.brand { font-size: 12px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
.theme-button {
  width: 38px; height: 38px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); border-radius: 50%;
  cursor: pointer; font-size: 16px;
}

header { border-bottom: 1px solid var(--border); padding-bottom: 30px; }
.title-row {
  display: flex; align-items: end; justify-content: space-between; gap: 24px;
}
h1 {
  margin: 0; font-size: clamp(44px, 8vw, 76px);
  line-height: .88; letter-spacing: -.065em;
}
.date-picker { position: relative; }
.date-button {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 10px; padding: 10px 13px; font: inherit; font-size: 13px; cursor: pointer;
}
.date-menu {
  display: none; position: absolute; right: 0; top: calc(100% + 8px);
  min-width: 245px; z-index: 10; background: var(--surface);
  border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 12px 30px rgba(0,0,0,.12); overflow: hidden;
}
.date-menu.open { display: block; }
.date-option {
  display: block; width: 100%; border: 0; background: transparent; color: var(--text);
  text-align: left; padding: 12px 14px; cursor: pointer;
}
.date-option:hover { background: var(--surface-2); }

.filters {
  display: flex; gap: 7px; flex-wrap: wrap; margin-top: 24px;
}
.filter {
  border: 1px solid var(--border); background: transparent; color: var(--muted-2);
  border-radius: 999px; padding: 8px 13px; font-size: 12px; font-weight: 700; cursor: pointer;
}
.filter.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

.big-picture { margin: 32px 0 44px; max-width: 720px; }
.section-label {
  font-size: 11px; font-weight: 800; letter-spacing: .13em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
}
.glance-list { list-style: none; margin: 0; padding: 0; }
.glance-list li {
  position: relative; padding-left: 18px; margin-bottom: 8px;
  font-size: 15px; line-height: 1.5; color: var(--muted-2);
}
.glance-list li::before {
  content: "—"; position: absolute; left: 0; color: var(--accent); opacity: .55;
}
.glance-list li:last-child { margin-bottom: 0; }

.section { margin-top: 46px; }
.story {
  display: grid; grid-template-columns: 250px 1fr;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; overflow: hidden; margin-bottom: 12px; box-shadow: var(--shadow);
}
.story > img, .image-placeholder {
  width: 100%; height: 100%; min-height: 220px; object-fit: cover;
  background: var(--surface-2);
}
.story-content { padding: 24px 26px 25px; }
.story-meta {
  display: flex; gap: 7px; align-items: center; font-size: 11px;
  font-weight: 800; text-transform: uppercase; letter-spacing: .09em; color: var(--muted);
}
.dot { opacity: .5; }
.story h2 {
  margin: 9px 0 12px; font-size: 27px; line-height: 1.08; letter-spacing: -.035em;
}
.story p { margin: 0; color: var(--muted-2); font-size: 15px; line-height: 1.58; }
.read {
  display: inline-flex; gap: 7px; margin-top: 19px; text-decoration: none;
  font-size: 12px; font-weight: 800;
}

.quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; }
.quick {
  display: flex; min-height: 118px; overflow: hidden; text-decoration: none;
  background: var(--surface); border: 1px solid var(--border); border-radius: 15px;
}
.quick img, .quick-placeholder {
  width: 105px; min-width: 105px; object-fit: cover; background: var(--surface-2);
}
.quick-content { padding: 15px 16px; }
.meta {
  color: var(--muted); font-size: 10px; font-weight: 800;
  letter-spacing: .09em; text-transform: uppercase;
}
.quick p { margin: 7px 0 0; color: var(--text); font-size: 14px; line-height: 1.43; }
.hidden { display: none !important; }
.empty { color: var(--muted); padding: 20px 0; }
footer {
  margin-top: 60px; padding-top: 18px; border-top: 1px solid var(--border);
  color: var(--muted); font-size: 11px;
}

@media (max-width: 700px) {
  .container { padding-top: 26px; }
  .topbar { margin-bottom: 40px; }
  .title-row { align-items: start; flex-direction: column; }
  .date-picker, .date-button { width: 100%; }
  .date-button { text-align: left; }
  .date-menu { left: 0; right: 0; }
  .story { grid-template-columns: 1fr; }
  .story > img, .image-placeholder { height: 190px; min-height: 190px; }
  .quick-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<main class="container">

  <div class="topbar">
    <div class="brand">AI Daily Digest</div>
    <button class="theme-button" id="themeButton" aria-label="Toggle theme">☾</button>
  </div>

  <header>
    <div class="title-row">
      <h1>What's happening.</h1>

      <div class="date-picker">
        <button class="date-button" id="dateButton">Today's digest ▾</button>
        <div class="date-menu" id="dateMenu"></div>
      </div>
    </div>

    <nav class="filters" aria-label="Topics">
      <button class="filter active" data-topic="all">All</button>
      <button class="filter" data-topic="apple">Apple</button>
      <button class="filter" data-topic="ai_software">AI + Software</button>
      <button class="filter" data-topic="ai_general">AI</button>
      <button class="filter" data-topic="tech">Tech</button>
    </nav>
  </header>

  <section class="big-picture">
    <div class="section-label">Today at a glance</div>
    <ul class="glance-list" id="executiveSummary"></ul>
  </section>

  <section class="section">
    <div class="section-label">Top stories</div>
    <div id="stories"></div>
  </section>

  <section class="section">
    <div class="section-label">Quick reads</div>
    <div class="quick-grid" id="quickReads"></div>
  </section>

  <footer>
    Curated automatically from selected technology sources
  </footer>
</main>

<script>
// -----------------------------------------------------------------------------
// ARCHIVE INDEX (dinámico, en vez de fechas hardcodeadas)
// -----------------------------------------------------------------------------
// n8n mantiene data/archive-index.json como un array simple de fechas ISO
// ordenadas de más reciente a más antigua, ej: ["2026-08-27","2026-08-26",...]
// La fecha más reciente se sirve desde data/latest.json (siempre fresco);
// el resto se resuelve a data/archive/{fecha}.json

let ARCHIVE = [];

// n8n (Convert to JSON) siempre envuelve el resultado en un array, aunque solo
// haya un item — estos helpers desenvuelven eso de forma centralizada.
function unwrapDigest(raw) {
  return Array.isArray(raw) ? raw[0] : raw;
}
function unwrapDates(raw) {
  if (Array.isArray(raw)) {
    if (raw.length && raw[0] && Array.isArray(raw[0].dates)) {
      return raw[0].dates;
    }
    return raw;
  }

  if (raw && Array.isArray(raw.dates)) {
    return raw.dates;
  }

  return [];
}

function formatLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const label = d.toLocaleDateString('es-ES', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });
  return label.charAt(0).toUpperCase() + label.slice(1);
}

async function loadArchiveIndex() {
  try {
    const res = await fetch('data/archive-index.json?_=' + Date.now());
    if (!res.ok) throw new Error('No archive index');
    const raw = await res.json();
    const dates = unwrapDates(raw);
    return dates.map((date, i) => ({
      date,
      label: formatLabel(date),
      file: i === 0 ? 'data/latest.json' : `data/archive/${date}.json`
    }));
  } catch (e) {
    console.warn('No se pudo cargar el índice de archivo, usando solo hoy:', e);
    return [{ date: null, label: 'Today', file: 'data/latest.json' }];
  }
}

// -----------------------------------------------------------------------------
// THEME
// -----------------------------------------------------------------------------

const themeButton = document.getElementById("themeButton");

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  localStorage.setItem("digest-theme", theme);
  themeButton.textContent = theme === "dark" ? "☀" : "☾";
}

const savedTheme = localStorage.getItem("digest-theme");
const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
applyTheme(savedTheme || (systemDark ? "dark" : "light"));

themeButton.addEventListener("click", () => {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});

// -----------------------------------------------------------------------------
// HELPERS
// -----------------------------------------------------------------------------

function escapeHTML(value) {
  const div = document.createElement("div");
  div.textContent = value ?? "";
  return div.innerHTML;
}

// Divide el resumen ejecutivo en frases cortas, estilo "at a glance",
// en vez de mostrarlo como un único párrafo largo.
function splitIntoGlanceItems(text) {
  if (!text) return [];
  return text
    .split(/(?<=[.!?])\s+(?=[A-ZÁÉÍÓÚÑ¿¡])/)
    .map(s => s.trim())
    .filter(Boolean);
}

function renderGlanceList(text) {
  const items = splitIntoGlanceItems(text);
  const list = document.getElementById("executiveSummary");
  list.innerHTML = items.map(item => `<li>${escapeHTML(item)}</li>`).join("");
}

function topicLabel(topic) {
  return {
    apple: "Apple",
    ai_software: "AI + Software",
    ai_general: "AI",
    tech: "Tech"
  }[topic] || topic;
}

// -----------------------------------------------------------------------------
// RENDER
// -----------------------------------------------------------------------------

let currentDigest = null;
let currentTopic = new URLSearchParams(location.search).get("topic") || "all";

function renderDigest(data) {
  currentDigest = data;

  renderGlanceList(data.resumen_ejecutivo || "");

  const stories = data.top_stories || [];
  const storyContainer = document.getElementById("stories");

  storyContainer.innerHTML = stories.map(story => {
    const topic = story.topic || "tech";
    const image = story.imagen
      ? `<img src="${escapeHTML(story.imagen)}" alt="" loading="lazy">`
      : `<div class="image-placeholder"></div>`;

    return `
      <article class="story" data-topic="${escapeHTML(topic)}">
        ${image}
        <div class="story-content">
          <div class="story-meta">
            <span>${escapeHTML(story.fuente)}</span>
            <span class="dot">·</span>
            <span>${escapeHTML(topicLabel(topic))}</span>
          </div>
          <h2>${escapeHTML(story.titulo)}</h2>
          <p>${escapeHTML(story.cuerpo)}</p>
          <a class="read" href="${escapeHTML(story.link)}"
             target="_blank" rel="noopener noreferrer">
            Read source <span>→</span>
          </a>
        </div>
      </article>
    `;
  }).join("");

  const quickContainer = document.getElementById("quickReads");
  quickContainer.innerHTML = (data.quick_reads || []).map(item => {
    const image = item.imagen
      ? `<img src="${escapeHTML(item.imagen)}" alt="" loading="lazy">`
      : `<div class="quick-placeholder"></div>`;

    return `
      <a class="quick" href="${escapeHTML(item.link)}"
         target="_blank" rel="noopener noreferrer">
        ${image}
        <div class="quick-content">
          <div class="meta">${escapeHTML(item.fuente)}</div>
          <p>${escapeHTML(item.texto)}</p>
        </div>
      </a>
    `;
  }).join("");

  applyTopicFilter(currentTopic);
}

function applyTopicFilter(topic) {
  currentTopic = topic;

  document.querySelectorAll(".filter").forEach(button => {
    button.classList.toggle("active", button.dataset.topic === topic);
  });

  document.querySelectorAll(".story").forEach(story => {
    story.classList.toggle(
      "hidden",
      topic !== "all" && story.dataset.topic !== topic
    );
  });

  const url = new URL(location.href);
  if (topic === "all") url.searchParams.delete("topic");
  else url.searchParams.set("topic", topic);
  history.replaceState(null, "", url);
}

// -----------------------------------------------------------------------------
// TOPIC FILTER
// -----------------------------------------------------------------------------

document.querySelectorAll(".filter").forEach(button => {
  button.addEventListener("click", () => {
    applyTopicFilter(button.dataset.topic);
  });
});

// -----------------------------------------------------------------------------
// DATE SELECTOR
// -----------------------------------------------------------------------------

const dateButton = document.getElementById("dateButton");
const dateMenu = document.getElementById("dateMenu");

dateButton.addEventListener("click", () => {
  dateMenu.classList.toggle("open");
});

document.addEventListener("click", event => {
  if (!event.target.closest(".date-picker")) {
    dateMenu.classList.remove("open");
  }
});

function getRequestedDate() {
  return new URLSearchParams(window.location.search).get("date");
}

function updateDateUrl(date) {
  const url = new URL(window.location.href);
  if (date) url.searchParams.set("date", date);
  else url.searchParams.delete("date");
  window.history.replaceState({}, "", url);
}

async function loadSelectedDigest(item) {
  if (!item || !item.file) throw new Error("Invalid digest selection");

  const response = await fetch(item.file + "?_=" + Date.now());
  if (!response.ok) throw new Error("Unable to load digest");

  const data = unwrapDigest(await response.json());
  renderDigest(data);
  dateButton.textContent = item.label + " ▾";
  updateDateUrl(item.date);
}

dateMenu.addEventListener("click", async event => {
  const option = event.target.closest(".date-option");
  if (!option) return;

  const item = ARCHIVE.find(entry => entry.date === option.dataset.date);
  if (!item) return;

  dateMenu.classList.remove("open");

  try {
    await loadSelectedDigest(item);
  } catch (error) {
    console.error(error);
  }
});

// -----------------------------------------------------------------------------
// INITIAL LOAD
// -----------------------------------------------------------------------------

async function init() {
  ARCHIVE = await loadArchiveIndex();

  if (!ARCHIVE.length) {
    document.getElementById("stories").innerHTML =
      '<p class="empty">Unable to load the archive.</p>';
    return;
  }

  dateMenu.innerHTML = ARCHIVE.map(item => `
    <button class="date-option"
            data-file="${escapeHTML(item.file)}"
            data-date="${escapeHTML(item.date || '')}">
      ${escapeHTML(item.label)}
    </button>
  `).join("");

  const requestedDate = getRequestedDate();
  const selected = ARCHIVE.find(item => item.date === requestedDate) || ARCHIVE[0];

  try {
    await loadSelectedDigest(selected);

    // If the requested date was invalid/missing, keep the canonical URL clean.
    if (!requestedDate) updateDateUrl(selected.date);
  } catch (error) {
    document.getElementById("stories").innerHTML =
      '<p class="empty">Unable to load the selected digest.</p>';
    console.error(error);
  }
}

init();
</script>
</body>
</html>

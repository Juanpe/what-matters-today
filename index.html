<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Daily Digest</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--text:#171717;--muted:#666;--border:#ddd;--soft:#eee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1000px;margin:auto;padding:36px 20px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:45px}.brand{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.date{position:relative}.date button{border:1px solid var(--border);background:var(--card);padding:9px 12px;border-radius:9px;cursor:pointer}.menu{display:none;position:absolute;right:0;top:42px;background:var(--card);border:1px solid var(--border);border-radius:10px;min-width:240px;overflow:hidden;z-index:5}.menu.open{display:block}.menu button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:11px 13px}.menu button:hover{background:var(--soft)}h1{font-size:clamp(46px,8vw,78px);line-height:.9;letter-spacing:-.06em;margin:0 0 30px}h2{letter-spacing:-.03em}.summary{max-width:760px;border-top:1px solid var(--border);padding-top:25px}.label{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}.summary p{font-size:16px;line-height:1.55;color:var(--muted)}section{margin-top:48px}.stories{display:grid;gap:12px}.story{display:grid;grid-template-columns:270px 1fr;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}.story img,.ph{width:100%;height:100%;min-height:220px;object-fit:cover;background:var(--soft)}.content{padding:23px}.meta{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.content h2{font-size:27px;line-height:1.08;margin:9px 0 12px}.content p{font-size:15px;line-height:1.55;color:var(--muted);margin:0}.read{display:inline-block;margin-top:17px;font-size:12px;font-weight:800}.quick{display:grid;grid-template-columns:110px 1fr;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;margin-bottom:10px}.quick img,.quick .ph{width:110px;height:120px;min-height:120px;object-fit:cover}.quick .content{padding:15px}.quick p{margin:7px 0 0;font-size:14px;line-height:1.45}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:22px}.filters button{border:1px solid var(--border);background:transparent;border-radius:99px;padding:8px 12px;cursor:pointer}.filters .active{background:var(--text);color:var(--bg)}.error{margin-top:25px;padding:15px;border:1px solid #c66;border-radius:10px;background:#fff5f5;color:#822;display:none}footer{margin-top:55px;padding-top:18px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}@media(max-width:700px){.story{grid-template-columns:1fr}.story img,.story .ph{height:210px}.top{align-items:flex-start}.date{margin-top:2px}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div class="brand">What Matters Today</div><div class="date"><button id="dateButton">aToday ▾</button><div class="menu" id="dateMenu"></div></div></div>
<h1>Daily Digest</h1>
<div class="filters"><button data-topic="all" class="active">All</button><button data-topic="apple">Apple</button><button data-topic="ai_software">AI + Software</button><button data-topic="ai_general">AI</button><button data-topic="tech">Tech</button></div>
<div class="summary"><div class="label">At a glance</div><div id="summaryText"></div></div>
<div id="error" class="error"></div>
<section><div class="label">Top stories</div><div id="stories" class="stories"></div></section>
<section><div class="label">Quick reads</div><div id="quickReads"></div></section>
<footer>Curated automatically from selected technology sources</footer>
</main>
<script>
const $=id=>document.getElementById(id);let digest=null,archive=[];let topic=new URLSearchParams(location.search).get('topic')||'all';
function esc(v){const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML}
function label(t){return ({apple:'Apple',ai_software:'AI + Software',ai_general:'AI',tech:'Tech'})[t]||t}
function unwrap(v){return Array.isArray(v)?v[0]:v}
function render(d){digest=d||{};const summary=d.daily_summary||Object.values(d.summary||{}).filter(Boolean).join(' ');$('summaryText').innerHTML=summary?'<p>'+esc(summary)+'</p>':'<p>No summary available.</p>';const stories=Array.isArray(d.top_stories)?d.top_stories:[];$('stories').innerHTML=stories.map(s=>{const image=s.image||'';return '<article class="story" data-topic="'+esc(s.topic||'tech')+'">'+(image?'<img src="'+esc(image)+'" alt="" onerror="this.outerHTML=\'<div class=\\"ph\\"></div>\'">':'<div class="ph"></div>')+'<div class="content"><div class="meta">'+esc(s.source||'')+' · '+esc(label(s.topic||'tech'))+'</div><h2>'+esc(s.title||'')+'</h2><p>'+esc(s.body||'')+'</p>'+(s.link?'<a class="read" href="'+esc(s.link)+'" target="_blank" rel="noopener">Read source →</a>':'')+'</div></article>'}).join('')||'<p>No stories available.</p>';const quick=Array.isArray(d.quick_reads)?d.quick_reads:[];$('quickReads').innerHTML=quick.map(s=>{const image=s.image||'';return '<a class="quick" href="'+esc(s.link||'#')+'" target="_blank" rel="noopener">'+(image?'<img src="'+esc(image)+'" alt="">':'<div class="ph"></div>')+'<div class="content"><div class="meta">'+esc(s.source||'')+'</div><p>'+esc(s.text||s.title||'')+'</p></div></a>'}).join('')||'<p>No quick reads available.</p>';applyTopic(topic)}
function applyTopic(t){topic=t;document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('active',b.dataset.topic===t));document.querySelectorAll('.story').forEach(s=>s.style.display=t==='all'||s.dataset.topic===t?'grid':'none');const u=new URL(location.href);if(t==='all')u.searchParams.delete('topic');else u.searchParams.set('topic',t);history.replaceState(null,'',u)}
async function load(file){const r=await fetch(file+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status+' loading '+file);const raw=await r.json();const d=unwrap(raw);if(!d||!Array.isArray(d.top_stories))throw new Error('JSON shape is invalid');render(d)}
async function init(){try{const r=await fetch('data/archive-index.json?v='+Date.now(),{cache:'no-store'});if(r.ok){const x=unwrap(await r.json());const dates=Array.isArray(x)?x:(x&&Array.isArray(x.dates)?x.dates:[]);archive=dates.map((d,i)=>({date:d,label:new Date(d+'T00:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}),file:i===0?'data/latest.json':'data/archive/'+d+'.json'}))}}catch(e){}if(!archive.length)archive=[{date:null,label:'Today',file:'data/latest.json'}];$('dateMenu').innerHTML=archive.map(x=>'<button data-date="'+esc(x.date||'')+'">'+esc(x.label)+'</button>').join('');const requested=new URLSearchParams(location.search).get('date');const selected=archive.find(x=>x.date===requested)||archive[0];$('dateButton').textContent=selected.label+' ▾';try{await load(selected.file);if(selected.date){const u=new URL(location.href);u.searchParams.set('date',selected.date);history.replaceState(null,'',u)}}catch(e){console.error(e);$('error').style.display='block';$('error').textContent='No se pudo cargar el digest: '+e.message}}
$('dateButton').onclick=()=>$('dateMenu').classList.toggle('open');document.addEventListener('click',e=>{if(!e.target.closest('.date'))$('dateMenu').classList.remove('open')});$('dateMenu').onclick=e=>{const b=e.target.closest('button');if(!b)return;const x=archive.find(a=>(a.date||'')===b.dataset.date);if(x){$('dateMenu').classList.remove('open');$('dateButton').textContent=x.label+' ▾';load(x.file).catch(err=>{$('error').style.display='block';$('error').textContent=err.message});const u=new URL(location.href);if(x.date)u.searchParams.set('date',x.date);history.replaceState(null,'',u)}};document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>applyTopic(b.dataset.topic));init();
</script>
</body></html>
